name: Release

# Push a tag like v1.3.0 to build arm64 and x86_64 DMGs and publish a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v1.3.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache static re2/abseil
        uses: actions/cache@v4
        with:
          path: build/release-${{ matrix.arch }}/deps
          key: deps-${{ matrix.arch }}-${{ hashFiles('scripts/build-dmg.sh') }}

      - name: Build DMG
        run: scripts/build-dmg.sh "${{ matrix.arch }}" "${TAG#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && shasum -a 256 *.dmg > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: MacEverything ${{ env.TAG }}
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/SHA256SUMS.txt
